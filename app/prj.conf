# Display
CONFIG_DISPLAY=y

# Pictures embedded in the firmware
CONFIG_IMAGE_PACK=y

# Power off between pictures, position kept in retained memory
CONFIG_TIMED_POWEROFF=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y

# Slideshow settings
CONFIG_APP_SLIDE_INTERVAL_SEC=300

CONFIG_LOG=y
# Messages must be out before the SoC powers off
CONFIG_LOG_MODE_IMMEDIATE=y

# Scale whole picture to fit, pad with white
CONFIG_IMAGE_PACK_FIT_CONTAIN=y
