# SPDX-License-Identifier: Apache-2.0

description: |
  Good Display GDEY0579F52, 5.79 inch 792x272 black/white/yellow/red e-paper
  panel with two cascaded controllers.

compatible: "gooddisplay,gdey0579f52"

include: gooddisplay,gdey0579f5x-common.yaml

properties:
  fast-refresh:
    type: boolean
    description: |
      Use the panel's fast refresh waveform (about 12 s) instead of the
      full one (about 20 s).
